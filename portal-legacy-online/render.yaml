services:
  - type: web
    name: portal-legacy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: portal-legacy-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
